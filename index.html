<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор ОСАГО 2026</title>
    <style>
        body {
            background: #0f172a;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        @media (max-width: 900px) {
            .main-container { grid-template-columns: 1fr; }
        }

        /* Левая часть - Ввод */
        .input-section {
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        label {
            display: block;
            margin-top: 15px;
            font-size: 12px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
        }

        select, input {
            width: 100%;
            margin-top: 5px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }

        .kvs-section {
            background: #334155;
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
        }

        .kvs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Правая часть - Результат */
        .result-section {
            background: #1e293b;
            padding: 24px;
            border-radius: 16px;
            height: fit-content;
            position: sticky;
            top: 20px;
            border: 2px solid #334155;
        }

        .result-total {
            font-size: 36px;
            font-weight: 800;
            color: #10b981;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #334155;
            padding-bottom: 15px;
        }

        .coeff-table {
            width: 100%;
            border-collapse: collapse;
        }

        .coeff-table td {
            padding: 12px 0;
            font-size: 14px;
            border-bottom: 1px solid #334155;
        }

        .coeff-name { color: #94a3b8; }
        .coeff-value { text-align: right; font-weight: 700; color: #f8fafc; }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            text-transform: none;
            color: #f1f5f9;
        }

        input[type="checkbox"] { width: auto; }
    </style>
</head>
